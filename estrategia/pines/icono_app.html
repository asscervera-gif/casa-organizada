<!doctype html>
<html><head><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:512px;height:512px;background:#2d6a4f;display:flex;align-items:center;justify-content:center}
  .box{width:220px;height:220px;border:14px solid #fff;border-radius:24px;position:relative}
  .line{position:absolute;top:50%;left:0;width:100%;height:14px;background:#fff;transform:translateY(-50%)}
</style></head>
<body><div class="box"><div class="line"></div></div></body></html>
